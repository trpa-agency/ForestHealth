<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forest Composition Table</title>

  <!-- AG Grid styles (v31+) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/core.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/theme-alpine.css" />
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>

  <style>
    html, body, #myGrid {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="myGrid" class="ag-theme-alpine"></div>

  <script>
const rawData = [
  { forest: "Jeffrey Pine", stage: "Early", target: "5–15%", class: "Under Represented", percent: 2.12, acres: 863.0, totalArea: 40757.64, acresFromTarget: 1174.77 },
  { forest: "Jeffrey Pine", stage: "Mid (closed canopy)", target: "5–10%", class: "Over Represented", percent: 28.48, acres: 11609.0, totalArea: 40757.64, acresFromTarget: -7532.8 },
  { forest: "Jeffrey Pine", stage: "Mid (open canopy)", target: "25–30%", class: "Within Range", percent: 27.75, acres: 11311.0, totalArea: 40757.64, acresFromTarget: 0 },
  { forest: "Jeffrey Pine", stage: "Late (open canopy)", target: "45–50%", class: "Under Represented", percent: 27.28, acres: 11119.0, totalArea: 40757.64, acresFromTarget: 7222.08 },
  { forest: "Jeffrey Pine", stage: "Late (closed canopy)", target: "5–10%", class: "Over Represented", percent: 14.37, acres: 5857.0, totalArea: 40757.64, acresFromTarget: -1780.78 },

  { forest: "White Fir/Sierra Mixed Conifer", stage: "Early", target: "10–20%", class: "Under Represented", percent: 3.45, acres: 2213.0, totalArea: 64174.92, acresFromTarget: 4204.0 },
  { forest: "White Fir/Sierra Mixed Conifer", stage: "Mid (closed canopy)", target: "5–15%", class: "Over Represented", percent: 37.27, acres: 23918.0, totalArea: 64174.92, acresFromTarget: -14291.66 },
  { forest: "White Fir/Sierra Mixed Conifer", stage: "Mid (open canopy)", target: "10–15%", class: "Over Represented", percent: 22.73, acres: 14590.0, totalArea: 64174.92, acresFromTarget: -4963.53 },
  { forest: "White Fir/Sierra Mixed Conifer", stage: "Late (open canopy)", target: "30–40%", class: "Under Represented", percent: 19.41, acres: 12457.0, totalArea: 64174.92, acresFromTarget: 6795.7 },
  { forest: "White Fir/Sierra Mixed Conifer", stage: "Late (closed canopy)", target: "20–30%", class: "Under Represented", percent: 17.14, acres: 10997.0, totalArea: 64174.92, acresFromTarget: 1838.0 },

  { forest: "Red Fir", stage: "Early", target: "10–20%", class: "Under Represented", percent: 2.19, acres: 491.0, totalArea: 22389.6, acresFromTarget: 1747.91 },
  { forest: "Red Fir", stage: "Mid (closed canopy)", target: "20–30%", class: "Over Represented", percent: 36.55, acres: 8183.0, totalArea: 22389.6, acresFromTarget: -1466.14 },
  { forest: "Red Fir", stage: "Mid (open canopy)", target: "5–15%", class: "Within Range", percent: 12.48, acres: 2794.0, totalArea: 22389.6, acresFromTarget: 0 },
  { forest: "Red Fir", stage: "Late (open canopy)", target: "15–25%", class: "Within Range", percent: 19.33, acres: 4328.0, totalArea: 22389.6, acresFromTarget: 0 },
  { forest: "Red Fir", stage: "Late (closed canopy)", target: "25–35%", class: "Within Range", percent: 29.45, acres: 6594.0, totalArea: 22389.6, acresFromTarget: 0 },
];


    // Add showForest for deduped display
    const rowData = rawData.map((row, i, arr) => {
      const prev = arr[i - 1];
      return { ...row, showForest: !prev || prev.forest !== row.forest };
    });

    const columnDefs = [
  {
    headerName: "Forest Type",
    field: "forest",
    cellRenderer: (params) => params.data.showForest ? params.value : '',
  },
  { headerName: "Seral Stage", field: "stage" },
  { headerName: "Desired % Range", field: "target" },
  { headerName: "Classification", field: "class" },
  {
    headerName: "Current Area %",
    field: "percent",
    valueFormatter: (params) => `${params.value.toFixed(2)}%`
  },
  {
    headerName: "Area (acres)",
    field: "acres",
    valueFormatter: (params) => Math.round(params.value).toLocaleString()
  },
  {
    headerName: "Total Forest Area (acres)",
    field: "totalArea",
    valueFormatter: (params) => Math.round(params.value).toLocaleString()
  },
  {
    headerName: "Acres From Target",
    field: "acresFromTarget",
    valueFormatter: (params) => {
      const val = Math.round(params.value);
      return `${val > 0 ? '+' : ''}${val.toLocaleString()}`;
    }
  }
];


    const gridOptions = {
      columnDefs,
      rowData,
      defaultColDef: {
        resizable: true,
        sortable: true,
        filter: true,
      }
    };

    document.addEventListener("DOMContentLoaded", function () {
      const gridDiv = document.querySelector("#myGrid");
      agGrid.createGrid(gridDiv, gridOptions);
    });
  </script>
</body>
</html>
