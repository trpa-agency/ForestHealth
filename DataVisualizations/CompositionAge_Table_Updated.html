<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Forest Seral Stage AG Grid</title>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css"
    />
    <style>
      html,
      body,
      #myGrid {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="myGrid" class="ag-theme-alpine"></div>

    <script>

        { field: "Forest Type", filter: true },
        { field: "Seral Stage", filter: true },
        { field: "Desired % Range" },
        { field: "Classification" },
        { field: "Current Area %", type: "numericColumn", valueFormatter: d => d.value.toFixed(2) + "%" },
        { field: "Area (m²)", type: "numericColumn", valueFormatter: d => Number(d.value).toLocaleString() },
        { field: "Area (acres)", type: "numericColumn", valueFormatter: d => d.value.toFixed(2) },
        { field: "Total Area of Type (acres)", type: "numericColumn", valueFormatter: d => d.value.toFixed(2) },
        { field: "Acres from Target", type: "numericColumn", valueFormatter: d => d.value.toFixed(2) }
      ];

      const gridOptions = {
        columnDefs,
        rowData,
        defaultColDef: {
          sortable: true,
          resizable: true,
        },
        pagination: true,
        paginationAutoPageSize: true,
      };

      document.addEventListener("DOMContentLoaded", function () {
        const gridDiv = document.querySelector("#myGrid");
        new agGrid.Grid(gridDiv, gridOptions);
      });
    </script>
  </body>
</html>
