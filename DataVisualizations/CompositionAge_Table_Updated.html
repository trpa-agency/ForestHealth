<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forest Composition Threshold</title>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
      }
      .ag-theme-alpine {
        height: 100%;
        width: 100%;
      }
      h1 {
        text-align: center;
        margin: 1rem 0;
      }
    </style>
  </head>
  <body>
    <h1>Composition Summary</h1>
    <div id="myGrid" class="ag-theme-alpine"></div>

    <script>
      const columnDefs = [
        { headerName: "Forest Type", field: "ForestType", sortable: true, filter: true },
        { headerName: "Seral Stage", field: "SeralStage", sortable: true, filter: true },
        { headerName: "Desired % Range", field: "DesiredPercentRange" },
        { headerName: "Classification", field: "Classification", cellStyle: params => {
          switch (params.value) {
            case 'Underrepresented': return { backgroundColor: '#fdd' };
            case 'Overrepresented': return { backgroundColor: '#ddf' };
            case 'Within': return { backgroundColor: '#dfd' };
            default: return null;
          }
        } },
        { headerName: "Current Area %", field: "CurrentAreaPercent", type: 'numericColumn' },
        { headerName: "Area (m²)", field: "AreaSqM", type: 'numericColumn' },
        { headerName: "Area (acres)", field: "AreaAcres", type: 'numericColumn' },
        { headerName: "Total Area of Type (acres)", field: "TotalAreaAcres", type: 'numericColumn' },
        { headerName: "Acres from Target", field: "AcresFromTarget", type: 'numericColumn' }
      ];

      const rowData = [
        { ForestType: "Jeffrey Pine", SeralStage: "Early", DesiredPercentRange: "5–15%", Classification: "Underrepresented", CurrentAreaPercent: 2.12, AreaSqM: 3492900.0, AreaAcres: 863.11, TotalAreaAcres: 40757.64, AcresFromTarget: 1174.77 },
        { ForestType: "Jeffrey Pine", SeralStage: "Mid (closed canopy)", DesiredPercentRange: "5–10%", Classification: "Overrepresented", CurrentAreaPercent: 28.48, AreaSqM: 46978200.0, AreaAcres: 11608.57, TotalAreaAcres: 40757.64, AcresFromTarget: -7532.8 },
        { ForestType: "Jeffrey Pine", SeralStage: "Mid (open canopy)", DesiredPercentRange: "25–30%", Classification: "Within", CurrentAreaPercent: 27.75, AreaSqM: 45772200.0, AreaAcres: 11310.56, TotalAreaAcres: 40757.64, AcresFromTarget: 0.0 },
        { ForestType: "Jeffrey Pine", SeralStage: "Late (open canopy)", DesiredPercentRange: "40–50%", Classification: "Underrepresented", CurrentAreaPercent: 27.28, AreaSqM: 44996400.0, AreaAcres: 11118.85, TotalAreaAcres: 40757.64, AcresFromTarget: 5184.2 },
        { ForestType: "Jeffrey Pine", SeralStage: "Late (closed canopy)", DesiredPercentRange: "5–10%", Classification: "Overrepresented", CurrentAreaPercent: 14.37, AreaSqM: 23700600.0, AreaAcres: 5856.55, TotalAreaAcres: 40757.64, AcresFromTarget: -1780.78 },
        { ForestType: "White Fir", SeralStage: "Early", DesiredPercentRange: "10–20%", Classification: "Underrepresented", CurrentAreaPercent: 3.45, AreaSqM: 8957700.0, AreaAcres: 2213.5, TotalAreaAcres: 64174.92, AcresFromTarget: 4204.0 },
        { ForestType: "White Fir", SeralStage: "Mid (closed canopy)", DesiredPercentRange: "5–15%", Classification: "Overrepresented", CurrentAreaPercent: 37.27, AreaSqM: 96792300.0, AreaAcres: 23917.9, TotalAreaAcres: 64174.92, AcresFromTarget: -14291.66 },
        { ForestType: "White Fir", SeralStage: "Mid (open canopy)", DesiredPercentRange: "15–20%", Classification: "Overrepresented", CurrentAreaPercent: 22.73, AreaSqM: 59042700.0, AreaAcres: 14589.77, TotalAreaAcres: 64174.92, AcresFromTarget: -1754.78 },
        { ForestType: "White Fir", SeralStage: "Late (open canopy)", DesiredPercentRange: "25–35%", Classification: "Underrepresented", CurrentAreaPercent: 19.41, AreaSqM: 50410800.0, AreaAcres: 12456.78, TotalAreaAcres: 64174.92, AcresFromTarget: 3586.95 },
        { ForestType: "White Fir", SeralStage: "Late (closed canopy)", DesiredPercentRange: "15–25%", Classification: "Within", CurrentAreaPercent: 17.14, AreaSqM: 44503200.0, AreaAcres: 10996.98, TotalAreaAcres: 64174.92, AcresFromTarget: 0.0 },
        { ForestType: "Red Fir", SeralStage: "Early", DesiredPercentRange: "10–20%", Classification: "Underrepresented", CurrentAreaPercent: 2.19, AreaSqM: 1987200.0, AreaAcres: 491.05, TotalAreaAcres: 22389.6, AcresFromTarget: 1747.91 },
        { ForestType: "Red Fir", SeralStage: "Mid (closed canopy)", DesiredPercentRange: "15–25%", Classification: "Overrepresented", CurrentAreaPercent: 36.55, AreaSqM: 33115500.0, AreaAcres: 8183.02, TotalAreaAcres: 22389.6, AcresFromTarget: -2585.62 },
        { ForestType: "Red Fir", SeralStage: "Mid (open canopy)", DesiredPercentRange: "15–25%", Classification: "Underrepresented", CurrentAreaPercent: 12.48, AreaSqM: 11305800.0, AreaAcres: 2793.72, TotalAreaAcres: 22389.6, AcresFromTarget: 564.72 },
        { ForestType: "Red Fir", SeralStage: "Late (open canopy)", DesiredPercentRange: "30–40%", Classification: "Underrepresented", CurrentAreaPercent: 19.33, AreaSqM: 17513100.0, AreaAcres: 4327.58, TotalAreaAcres: 22389.6, AcresFromTarget: 2389.3 },
        { ForestType: "Red Fir", SeralStage: "Late (closed canopy)", DesiredPercentRange: "20–30%", Classification: "Within", CurrentAreaPercent: 29.45, AreaSqM: 26685900.0, AreaAcres: 6594.23, TotalAreaAcres: 22389.6, AcresFromTarget: 0.0 }
      ];

      const gridOptions = {
        columnDefs,
        rowData,
        defaultColDef: {
          resizable: true,
          sortable: true,
          filter: true,
        },
        animateRows: true,
      };

      document.addEventListener('DOMContentLoaded', function () {
        const gridDiv = document.querySelector('#myGrid');
        new agGrid.Grid(gridDiv, gridOptions);
      });
    </script>
  </body>
</html>
