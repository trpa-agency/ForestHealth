<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Stand Density — TRPA Data</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Calder substitute (replace with your actual Calder font link if you have one) -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- AG Grid -->
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-quartz.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-quartz-dark.css" />

  <style>
    :root {
      /* === LAKE TAHOE EIP BRAND COLORS === */
      --brand-green: #6ebe44;   /* Pantone 802 C */
      --brand-blue:  #007dc3;   /* Pantone 285 C */
      --brand-orange:#f16022;   /* Pantone 1505 C */
      --brand-navy:  #0b1f41;   /* Pantone 282 C */

      /* Defaults */
      --brand-primary: var(--brand-blue);
      --brand-accent:  var(--brand-green);
      --brand-warn:    var(--brand-orange);
      --brand-dark:    var(--brand-navy);

      --brand-muted:   #6b7a90;
      --brand-bg:      #f7fafc;
      --brand-card:    #ffffff;
      --brand-font:    'Calder', 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;

      --radius-lg: 16px;
      --radius-md: 12px;
      --shadow: 0 10px 24px rgba(2, 12, 27, 0.08);

      --brand-bg-dark: #0f1420;
      --brand-card-dark: #111827;
      --brand-muted-dark: #9aa4b2;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--brand-bg);
      color: var(--brand-dark);
      font-family: var(--brand-font);
    }

    .page { max-width: 1200px; margin: 28px auto; padding: 0 20px; }

    /* Header */
    .hdr {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }
    .logo img { height: 36px; width: auto; border-radius: 8px; }
    .title h1 { font-size: clamp(20px, 2vw, 28px); margin: 0; font-weight: 700; }
    .title p { margin: 2px 0 0; color: var(--brand-muted); font-size: 14px; }

    /* Card */
    .card {
      background: var(--brand-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      border: 1px solid rgba(2,12,27,0.06);
      overflow: clip;
    }

    /* Toolbar */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px;
      align-items: center; justify-content: space-between;
      padding: 14px 14px;
      border-bottom: 1px solid rgba(2,12,27,0.06);
      background: linear-gradient(0deg, rgba(110,190,68,0.08), rgba(110,190,68,0.08)), var(--brand-card);
    }
    .search { position: relative; }
    .search input {
      padding: 10px 12px 10px 36px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(2,12,27,0.12);
      min-width: 260px;
      outline: none;
    }
    .search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--brand-muted); }

    .btn {
      border: 1px solid rgba(2,12,27,0.12);
      background: #fff;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn:hover { background: #f1f5f9; }
    .btn-primary { background: var(--brand-primary); color: #fff; border-color: var(--brand-primary); }
    .btn-primary:hover { filter: brightness(1.05); }

    .divider { width:1px; height: 28px; background: rgba(2,12,27,0.12); }

    .toggle {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(2,12,27,0.06);
      border: 1px solid rgba(2,12,27,0.12);
      cursor: pointer;
    }

    .grid-wrap { height: calc(80vh - 60px); }

    .footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px; font-size: 13px; color: var(--brand-muted);
      border-top: 1px solid rgba(2,12,27,0.06);
      background: #fbfdff;
    }

    /* Dark mode */
    .dark body { background: var(--brand-bg-dark); color: #e5e7eb; }
    .dark .card { background: var(--brand-card-dark); border-color: rgba(255,255,255,0.06); }
    .dark .toolbar { background: linear-gradient(0deg, rgba(110,190,68,0.12), rgba(110,190,68,0.12)), var(--brand-card-dark); border-bottom-color: rgba(255,255,255,0.06); }
    .dark .footer { background: #0b1220; border-top-color: rgba(255,255,255,0.06); }
    .dark .search input { background: #0b1220; border-color: rgba(255,255,255,0.12); color: #e5e7eb; }
    .dark .btn { background: #0b1220; color: #e5e7eb; border-color: rgba(255,255,255,0.12); }
    .dark .btn:hover { background: #0e172a; }
    .dark .divider { background: rgba(255,255,255,0.12); }
    .dark .title p { color: var(--brand-muted-dark); }
  </style>
</head>
<body>
  <div class="page">

    <!-- Header -->
    <div class="hdr">
      <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Lake_Tahoe_NASA.jpg/320px-Lake_Tahoe_NASA.jpg" alt="TRPA logo placeholder" />
        <div class="title">
          <h1>Stand Density Table</h1>
          <p>Lake Tahoe EIP • Filter, explore, and export records</p>
        </div>
      </div>
    </div>

    <div class="card">
      <!-- Toolbar -->
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search">
            <span class="icon">🔎</span>
            <input id="quickFilter" type="search" placeholder="Search…" />
          </div>
          <button id="btnColumns" class="btn">Columns</button>
          <button id="btnDensity" class="btn">Density</button>
          <span class="divider"></span>
          <button id="btnReset" class="btn">Reset</button>
        </div>
        <div class="toolbar-right">
          <label class="toggle">
            <input id="darkToggle" type="checkbox" /> <span>Dark</span>
          </label>
          <button id="btnExport" class="btn btn-primary">Export CSV</button>
        </div>
      </div>

      <div id="grid" class="ag-theme-quartz grid-wrap"></div>

      <div class="footer">
        <div id="rowCount">0 rows</div>
        <div id="selCount">0 selected</div>
      </div>
    </div>
  </div>

  <script>
    const columnDefs = [
      { headerName: 'Unit', field: 'unit', filter: 'agTextColumnFilter' },
      { headerName: 'Stand ID', field: 'stand_id', filter: 'agTextColumnFilter' },
      { headerName: 'Seral Stage', field: 'seral_stage', filter: 'agSetColumnFilter' },
      { headerName: 'Canopy Cover (%)', field: 'canopy_cover', type: 'numericColumn', filter: 'agNumberColumnFilter' },
      { headerName: 'Trees / Acre', field: 'tpa', type: 'numericColumn', filter: 'agNumberColumnFilter' },
      { headerName: 'Basal Area', field: 'basal_area', type: 'numericColumn', filter: 'agNumberColumnFilter' },
      { headerName: 'Treatment', field: 'treatment', filter: 'agSetColumnFilter' },
      { headerName: 'Year', field: 'year', type: 'numericColumn', filter: 'agNumberColumnFilter' },
    ];

    const rowData = [
      { unit: 'U-01', stand_id: 'ST-1001', seral_stage: 'Mid', canopy_cover: 42, tpa: 180, basal_area: 120, treatment: 'Thin', year: 2023 },
      { unit: 'U-01', stand_id: 'ST-1002', seral_stage: 'Early', canopy_cover: 28, tpa: 240, basal_area: 98, treatment: 'RX Fire', year: 2022 },
      { unit: 'U-02', stand_id: 'ST-2011', seral_stage: 'Late/Open', canopy_cover: 18, tpa: 60,  basal_area: 70,  treatment: 'None', year: 2021 },
      { unit: 'U-03', stand_id: 'ST-3007', seral_stage: 'Late/Closed', canopy_cover: 65, tpa: 300, basal_area: 180, treatment: 'Thin+RX', year: 2024 },
    ];

    const gridOptions = {
      columnDefs,
      rowData,
      defaultColDef: { sortable: true, filter: true, resizable: true, floatingFilter: true, flex: 1 },
      animateRows: true,
      rowSelection: 'multiple',
      pagination: true,
      paginationPageSize: 25,
      sideBar: {
        toolPanels: [{ id: 'columns', labelDefault: 'Columns', iconKey: 'columns', toolPanel: 'agColumnsToolPanel' }],
        defaultToolPanel: undefined
      }
    };

    const gridDiv = document.getElementById('grid');
    new agGrid.Grid(gridDiv, gridOptions);

    // Search
    document.getElementById('quickFilter').addEventListener('input', e => {
      gridOptions.api.setGridOption('quickFilterText', e.target.value);
    });

    // Export
    document.getElementById('btnExport').addEventListener('click', () => {
      gridOptions.api.exportDataAsCsv({ fileName: 'stand_density.csv' });
    });

    // Columns
    document.getElementById('btnColumns').addEventListener('click', () => {
      const isOpen = gridOptions.api.getOpenedToolPanel();
      if (isOpen) gridOptions.api.closeToolPanel(); else gridOptions.api.openToolPanel('columns');
    });

    // Density
    let dense = false;
    document.getElementById('btnDensity').addEventListener('click', () => {
      dense = !dense;
      gridOptions.api.setGridOption('rowHeight', dense ? 32 : 48);
      gridOptions.api.resetRowHeights();
    });

    // Reset
    document.getElementById('btnReset').addEventListener('click', () => {
      gridOptions.api.setFilterModel(null);
      gridOptions.columnApi.resetColumnState();
      gridOptions.api.setSortModel(null);
      gridOptions.api.setGridOption('quickFilterText', '');
      document.getElementById('quickFilter').value = '';
    });

    // Dark mode
    const darkToggle = document.getElementById('darkToggle');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const savedTheme = localStorage.getItem('standDensity_theme');
    const startDark = savedTheme ? savedTheme === 'dark' : prefersDark;

    function applyTheme(isDark) {
      document.documentElement.classList.toggle('dark', isDark);
      gridDiv.classList.toggle('ag-theme-quartz-dark', isDark);
      gridDiv.classList.toggle('ag-theme-quartz', !isDark);
      localStorage.setItem('standDensity_theme', isDark ? 'dark' : 'light');
    }
    darkToggle.checked = startDark;
    applyTheme(startDark);
    darkToggle.addEventListener('change', e => applyTheme(e.target.checked));
  </script>
</body>
</html>
